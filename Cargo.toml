[package]
name = "scylla"
version = "0.2.0"
edition = "2024"

[features]
default = ["python-extension", "openssl-010"]
python-extension = ["pyo3/extension-module"]
openssl-010 = ["dep:openssl", "scylla/openssl-010"]
openssl-vendored = ["openssl-010", "openssl/vendored"]
rust-tests = ["openssl-010"]

[lib]
name = "scylla"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["bigdecimal", "num-bigint", "uuid", "chrono", "time", "py-clone"] }
tokio = { version = "1.42.0", features = ["full"] }

scylla = { version = "=1.10.0", features = ["chrono-04", "bigdecimal-04", "num-bigint-04", "unstable-python-rs", "openssl-010"] }
scylla-cql-core = { version = "=1.10.0", features = ["chrono-04", "bigdecimal-04", "num-bigint-04", "unstable-python-rs"] }

yoke = "0.8.1"
stable_deref_trait = "1.2"
thiserror = "2.0.6"
uuid = { version = "1.11.0", features = ["v4"] }
bigdecimal = "0.4"
chrono = "0.4"
num-bigint = "0.4"
async-trait = "0.1.89"
log = "0.4.29"
tracing = { version = "0.1", features = ["log"] }
pyo3-log = "0.13.3"
bytes = "1.11.1"
pin-project-lite = "0.2.17"
futures = { version = "0.3.33", default-features = false, features = ["std"] }
openssl = { version = "0.10", optional = true }

[build-dependencies]
pyo3-build-config = "=0.29.0"
