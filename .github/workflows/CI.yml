name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCYLLA_URI: "127.0.0.2:9042"
  SCYLLA_URI2: "127.0.0.3:9042"
  SCYLLA_URI3: "127.0.0.4:9042"
  RUSTFLAGS: "-Dwarnings --cfg scylla_unstable"

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run static checks
        run: make static

  rust-tests:
    name: Native Rust Tests
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Start ScyllaDB cluster
        run: make up

      - name: Wait for cluster to be ready
        run: |
          for i in {1..30};
          do docker ps | grep -q "unhealthy\|starting" &&
          echo "Waiting for nodes... (attempt $i/30)" && sleep 1 ||
          { echo "All nodes ready"; break; }; done

      - name: Run native Rust tests
        run: make test-rust

      - name: Stop and cleanup ScyllaDB cluster
        if: always()
        run: |
          make down
          docker system prune -af --volumes

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: static-checks
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Start ScyllaDB cluster
        run: make up

      - name: Wait for cluster to be ready
        run: |
          for i in {1..30};
          do docker ps | grep -q "unhealthy\|starting" &&
          echo "Waiting for nodes... (attempt $i/30)" && sleep 1 ||
          { echo "All nodes ready"; break; }; done

      - name: Run tests with Python ${{ matrix.python-version }}
        run: uv run --python ${{ matrix.python-version }} pytest -v

      - name: Stop and cleanup ScyllaDB cluster
        if: always()
        run: |
          make down
          docker system prune -af --volumes

  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Start ScyllaDB cluster
        run: make up

      - name: Wait for cluster to be ready
        run: |
          for i in {1..30};
          do docker ps | grep -q "unhealthy\|starting" &&
          echo "Waiting for nodes... (attempt $i/30)" && sleep 1 ||
          { echo "All nodes ready"; break; }; done

      - name: Run examples with Python 3.14
        run: |
          set -e; for f in examples/*.py; do uv run --python 3.14 "$f"; done;

      - name: Stop and cleanup ScyllaDB cluster
        if: always()
        run: |
          make down
          docker system prune -af --volumes
