[project]
name = "python-rs-driver-docs"
description = "ScyllaDB Python RS Driver Documentation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygments>=2.18.0",
    "sphinx>=9.1.1,<10",
    "sphinx-scylladb-theme>=1.10.0,<1.11",
    "myst-parser>=5.0.0",
    "sphinx-autobuild>=2025.08.25",
    "sphinx-sitemap>=2.9.0",
    "sphinx-multiversion-scylla>=0.3.9",
    # docs/source/_ext/autoapi_fixes.py patches its private API.
    "sphinx-autoapi>=3.8.1,<3.9",
]

[dependency-groups]
dev = [
    "types-docutils>=0.23.0.20260923",
]

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.uv]
package = false
